<!DOCTYPE html>
<html>
<head>
<title>Lay's Crunch Hub - Payment</title>

<style>

{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background-image:url("../static/cart_bg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    animation:fadeBody 1.5s ease-in-out;
}

/* Page Animation */
@keyframes fadeBody{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

/* Navbar */

.navbar{
    background:linear-gradient(90deg,#90EE90,#7CFC00,#90EE90);
    background-size:300% 300%;
    animation:navbarMove 6s infinite;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

@keyframes navbarMove{
    0%{background-position:0%;}
    50%{background-position:100%;}
    100%{background-position:0%;}
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:darkred;
}

.menu a{
    text-decoration:none;
    color:black;
    font-size:20px;
    font-weight:bold;
    margin-left:20px;
    transition:0.4s;
}

.menu a:hover{
    color:red;
    transform:scale(1.15);
}

/* Payment Box */

.payment-box{
    width:450px;
    background:rgba(255,255,255,0.95);
    margin:60px auto;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px gray;

    animation:popup 1s ease;
}

@keyframes popup{
    from{
        transform:translateY(60px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Floating Effect */

.payment-box:hover{
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0);
    }
}

h2{
    color:darkred;
}

label{
    font-size:18px;
    font-weight:bold;
}

select,input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:2px solid lightgray;
    font-size:16px;
    transition:0.4s;
}

input:focus,
select:focus{
    border-color:red;
    box-shadow:0 0 12px red;
    outline:none;
}

/* Animated Button */

button{
    background:#e53935;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
    transition:.4s;
    animation:glow 2s infinite;
}

button:hover{
    transform:scale(1.08);
    background:darkred;
}

@keyframes glow{
    0%{
        box-shadow:0 0 5px red;
    }
    50%{
        box-shadow:0 0 25px red;
    }
    100%{
        box-shadow:0 0 5px red;
    }
}

/* Success Box */

#success{
    display:none;
    animation:zoom 1s ease;
}

@keyframes zoom{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* Animated Tick */

.tick{
    font-size:90px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-20px);
    }
}

</style>

<script>

function paymentSuccess(){

document.getElementById("success").style.display="block";

}

</script>

</head>

<body>

<div class="navbar">

<div class="logo">
🛒 Lay's Crunch Hub
</div>

<div class="menu">
<a href="/dashboard">🏠 Home</a>
<a href="/cart">🛒 Cart</a>
<a href="/payment">💰payment</a>
<a href="/profile">👤 Profile</a>
<a href="/logout">🚪 Logout</a>
</div>

</div>

<form action="/payment" method="POST">
<div class="payment-box" id="paymentForm">

<h2>Payment Details</h2>
<input type="text" name="name" placeholder="Your Name" required><br><br>

<input type="email" name="email" placeholder="Your Email" required><br><br>

<label>Select Payment Method</label><br><br>

<select name="method">
    <option>UPI</option>
    <option>Credit Card</option>
    <option>Debit Card</option>
    <option>Net Banking</option>
    <option>Cash on Delivery</option>
</select><br><br>

<input type="text" name="cardnumber" placeholder="Card / UPI Number" required><br><br>

<input type="text" name="cardholder" placeholder="Card Holder Name" required><br><br>

<input type="password" name="cvv" placeholder="CVV / UPI PIN" required><br><br>

<button type="submit">Pay Now</button>

</form>

<div class="payment-box" id="success" style="display:none;">

<div class="tick">✅</div>

<h2 style="color:green;">Payment Successful!</h2>

<p>
Thank you for shopping with Lay's Crunch Hub.<br><br>
Your order has been placed successfully.
</p>

<a href="/dashboard">
<button style="background:green;">Continue Shopping</button>
</a>

<br><br>

<a href="/profile">
    <button style="background:#4CAF50; color:white;">
        👤 Go to Profile
    </button>
</a>

</div>

</div>

</body>
</html>
